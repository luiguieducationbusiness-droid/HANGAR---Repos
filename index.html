<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANGAR · Control de microapps y webs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header>
 <div><h1>HAN<span>GAR</span></h1><div class="sub">Tu flota de microapps y webs · control de misión</div></div>
 <div class="stats" id="stats"></div>
</header>
<div class="bar">
 <input id="q" class="in" placeholder="Buscar por nombre, etiqueta, tecnología…" autocomplete="off">
 <select id="sort" class="in"><option value="rec">Más recientes</option><option value="az">A → Z</option><option value="use">Más usadas</option><option value="fav">Favoritas primero</option></select>
 <button class="btn" id="vw">▦ / ☰</button>
 <button class="btn" id="pal">Buscar rápido<kbd>Ctrl K</kbd></button>
 <button class="btn" id="sync">○ Solo local</button>
 <button class="btn p" id="add">+ Nueva</button>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="bar" style="margin-top:34px;border-top:1px solid var(--line);padding-top:16px">
 <button class="btn" id="exp">Exportar respaldo</button><button class="btn" id="imp">Importar respaldo</button><button class="btn" id="th">Tema claro / oscuro</button>
</div>
</div>

<dialog id="dlg"><form method="dialog" onsubmit="return false">
 <div class="dh"><span id="dt">Nueva ficha</span><button class="btn" type="button" onclick="dlg.close()">✕</button></div>
 <div class="df">
  <label class="full">Nombre<input class="in" id="f_n" required></label>
  <label class="full">Enlace (URL)<input class="in" id="f_u" placeholder="https://mi-app.vercel.app"></label>
  <label class="full">Descripción<textarea class="in" id="f_d"></textarea></label>
  <label>Tipo<select class="in" id="f_t"><option value="app">Microapp</option><option value="pwa">PWA</option><option value="web">Página web</option></select></label>
  <label>Estado<select class="in" id="f_s"><option value="vuelo">En vuelo (activa)</option><option value="taller">En taller (desarrollo)</option><option value="tierra">En tierra (pausada)</option><option value="archivo">Archivo</option></select></label>
  <label>Etiquetas (coma)<input class="in" id="f_g"></label>
  <label>Tecnología / hosting<input class="in" id="f_k" placeholder="Vercel, GitHub Pages…"></label>
  <label class="full">Notas privadas<textarea class="in" id="f_o"></textarea></label>
  <label class="full">Imagen de referencia (opcional)<input type="file" id="f_i" accept="image/*" class="in"></label>
  <div class="full pv" id="pv"></div>
 </div>
 <div class="dfoot"><button class="btn" type="button" id="noimg">Quitar imagen</button><button class="btn p" type="button" id="save">Guardar</button></div>
</form></dialog>

<dialog id="pd"><input id="pq" class="in" placeholder="Escribe para abrir una app…"><ul id="pl"></ul></dialog>
<dialog id="xd"><div class="dh"><span id="xt">Respaldo</span><button class="btn" type="button" onclick="xd.close()">✕</button></div>
 <div class="df"><textarea class="in full" id="xa" style="min-height:220px;font:12px var(--m)"></textarea></div>
 <div class="dfoot"><button class="btn" id="xc">Copiar</button><button class="btn p" id="xo">Aplicar</button></div></dialog>
<dialog id="sd"><div class="dh"><span>Conexión con Google Sheets</span><button class="btn" type="button" onclick="sd.close()">✕</button></div>
 <div class="df">
  <label class="full">URL de la aplicación web (Apps Script)<input class="in" id="s_u" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label class="full">Clave secreta (la misma de Code.gs)<input class="in" id="s_k" type="password" autocomplete="off"></label>
  <p class="full hint" id="s_m"></p>
 </div>
 <div class="dfoot"><button class="btn d" id="s_x">Desconectar</button><button class="btn" id="s_up">Subir mis datos</button><button class="btn" id="s_t">Probar</button><button class="btn p" id="s_s">Guardar y sincronizar</button></div></dialog>
<div class="toast" id="toast"></div>

<script src="sheets.js"></script>
<script src="app.js"></script>
</body>
</html>
